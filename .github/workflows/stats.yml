name: pkg.pr.new stats

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Preview & Release
    types:
      - completed

jobs:
  stats:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: production-stats
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: "16"

      - name: Fetch and Count Data Iteratively
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function fetchWithRetry(url, maxAttempts = 5) {
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  const response = await fetch(url);

                  if (!response.ok) {
                    const body = (await response.text()).slice(0, 500);
                    throw new Error(
                      `HTTP error! status: ${response.status}${body ? `: ${body}` : ""}`,
                    );
                  }

                  return response;
                } catch (error) {
                  if (attempt === maxAttempts) {
                    throw error;
                  }

                  const delay = Math.min(1000 * 2 ** (attempt - 1), 30000);
                  console.warn(
                    `Fetch failed (${attempt}/${maxAttempts}): ${error.message}. Retrying in ${delay / 1000}s.`,
                  );
                  await sleep(delay);
                }
              }
            }

            async function fetchAndCountData(url, type, counts) {
              let cursor = null;
              let pages = 0;

              do {
                try {
                  // Construct the URL with cursor if available
                  const fetchUrl = `${url}?type=${type}${
                    cursor ? `&cursor=${encodeURIComponent(cursor)}` : ""
                  }`;

                  // Fetch the data from the API
                  const response = await fetchWithRetry(fetchUrl);

                  const responseData = await response.json();
                  pages += 1;

                  // Process the current page of data
                  if (responseData.data) {
                    for (const item of responseData.data) {
                      if (item.type !== type) {
                        throw new Error(
                          `Expected ${type} data but received ${item.type}`,
                        );
                      }

                      if (item.type === "template") {
                        counts.templates += 1;
                      } else if (item.type === "package") {
                        counts.packages += 1;
                        counts.orgs.add(item.org);
                        counts.repos.add(item.repo);
                        counts.commits += 1; // Count one commit per package
                      } else if (item.type === "cursor") {
                        counts.orgs.add(item.org);
                        counts.repos.add(item.repo);

                        // Count PR numbers and branch names combined
                        counts.prsAndBranches += 1;
                      }
                    }
                  }

                  // Update the cursor for the next page
                  cursor = responseData.nextCursor || null;

                  if (pages % 100 === 0) {
                    console.log(`Scanned ${pages} ${type} pages`);
                  }
                } catch (error) {
                  console.error(`Error fetching ${type} data: ${error.message}`);
                  throw error;
                }
              } while (cursor);

              console.log(`Finished ${type}: ${pages} pages`);
            }

            const url = "https://pkg.pr.new/stats";
            const counts = {
              templates: 0,
              packages: 0,
              orgs: new Set(),
              repos: new Set(),
              commits: 0,
              prsAndBranches: 0,
            };

            await Promise.all(
              ["cursor", "package", "template"].map((type) =>
                fetchAndCountData(url, type, counts),
              ),
            );

            console.log("Counts:", {
              templates: counts.templates,
              packages: counts.packages,
              orgs: counts.orgs.size,
              repos: counts.repos.size,
              commits: counts.commits,
              prsAndBranches: counts.prsAndBranches,
            });
