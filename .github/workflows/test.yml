name: E2E Test
on:
  push:
    branches:
      - main
      - release
  pull_request:

jobs:
  ci:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          npm install -g corepack@latest
          corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install

      - run: pnpm test
